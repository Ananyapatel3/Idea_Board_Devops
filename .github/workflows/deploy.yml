name: Test, Build, and Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud:
        description: Cloud provider to deploy to
        type: choice
        required: true
        options: [aws, gcp]
      approve_infrastructure:
        description: "Set to yes to apply Terraform and create billable cloud resources"
        type: choice
        required: true
        options: [no, yes]
        default: no

permissions:
  contents: read

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_ideas
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_ideas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend and AI utility tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://test_user:test_pass@localhost:5432/test_ideas
        run: python -m pytest -q backend/tests ai/test_deployment_analyzer.py

      - name: Lint Python
        run: python -m ruff check backend ai

      - name: Check Python syntax
        run: python -m compileall -q backend ai

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Validate AWS Terraform
        working-directory: terraform/environments/aws
        run: terraform init -backend=false && terraform validate

      - name: Validate GCP Terraform
        working-directory: terraform/environments/gcp
        run: terraform init -backend=false && terraform validate

      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s > "$RUNNER_TEMP/kubernetes-rendered.yaml"

  build:
    name: Build and publish neutral images
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
      backend_image: ${{ steps.image-paths.outputs.backend }}
      frontend_image: ${{ steps.image-paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image paths
        id: image-paths
        run: |
          OWNER_LC=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${OWNER_LC}/idea-board-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER_LC}/idea-board-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and scan backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ${{ steps.image-paths.outputs.backend }}:${{ github.sha }}

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-paths.outputs.backend }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-files: "**/pip/_vendor/bom.cdx.json"
          ignore-unfixed: true

      - name: Push backend image
        env:
          IMAGE: ${{ steps.image-paths.outputs.backend }}
        run: docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Build and scan frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: ${{ steps.image-paths.outputs.frontend }}:${{ github.sha }}

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image-paths.outputs.frontend }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push frontend image
        env:
          IMAGE: ${{ steps.image-paths.outputs.frontend }}
        run: docker push "${IMAGE}:${GITHUB_SHA}"

  plan-aws:
    name: Create AWS Terraform plan
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.cloud == 'aws' &&
      inputs.approve_infrastructure == 'yes'
    runs-on: ubuntu-latest
    environment: plan-aws
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_EKS_API_CIDR: ${{ vars.AWS_EKS_API_CIDR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Create and display AWS Terraform plan
        working-directory: terraform/environments/aws
        run: |
          test -n "$TF_VAR_db_password" || { echo "DB_PASSWORD secret is required"; exit 1; }
          test -n "$AWS_EKS_API_CIDR" || { echo "AWS_EKS_API_CIDR Actions variable is required"; exit 1; }
          python -c "import ipaddress,sys; ipaddress.ip_network(sys.argv[1], strict=False)" "$AWS_EKS_API_CIDR"
          terraform init
          terraform plan -var="control_plane_authorized_cidrs=[\"${AWS_EKS_API_CIDR}\"]" -out=tfplan
          terraform show -no-color tfplan | tee tfplan.txt
          {
            echo "## AWS Terraform plan"
            echo '```'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store reviewed AWS plan for one day
        uses: actions/upload-artifact@v4
        with:
          name: aws-terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terraform/environments/aws/tfplan
            terraform/environments/aws/tfplan.txt
          retention-days: 1
          if-no-files-found: error

  deploy-aws:
    name: Apply approved AWS plan and deploy
    needs: [plan-aws, build]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.cloud == 'aws' &&
      inputs.approve_infrastructure == 'yes'
    runs-on: ubuntu-latest
    environment: production-aws
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GHCR_BACKEND: ${{ needs.build.outputs.backend_image }}
      GHCR_FRONTEND: ${{ needs.build.outputs.frontend_image }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download reviewed AWS Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: aws-terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: terraform/environments/aws

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reviewed AWS Terraform plan
        working-directory: terraform/environments/aws
        run: |
          terraform init
          terraform apply -auto-approve tfplan

      - name: Copy images to ECR
        id: ecr
        working-directory: terraform/environments/aws
        run: |
          REGION=$(terraform output -raw region)
          RELEASE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          aws ecr get-login-password --region "$REGION" | docker login --username AWS --password-stdin "$(terraform output -raw backend_image_repository | cut -d/ -f1)"
          BACKEND_REPO=$(terraform output -raw backend_image_repository)
          FRONTEND_REPO=$(terraform output -raw frontend_image_repository)
          docker pull "${GHCR_BACKEND}:${GITHUB_SHA}"
          docker pull "${GHCR_FRONTEND}:${GITHUB_SHA}"
          docker tag "${GHCR_BACKEND}:${GITHUB_SHA}" "${BACKEND_REPO}:${RELEASE_TAG}"
          docker tag "${GHCR_FRONTEND}:${GITHUB_SHA}" "${FRONTEND_REPO}:${RELEASE_TAG}"
          docker push "${BACKEND_REPO}:${RELEASE_TAG}"
          docker push "${FRONTEND_REPO}:${RELEASE_TAG}"
          echo "backend=${BACKEND_REPO}" >> "$GITHUB_OUTPUT"
          echo "frontend=${FRONTEND_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS cluster access
        working-directory: terraform/environments/aws
        run: aws eks update-kubeconfig --name "$(terraform output -raw cluster_name)" --region "$(terraform output -raw region)"

      - name: Create namespace and database secret
        working-directory: terraform/environments/aws
        run: |
          kubectl apply -f ../../../k8s/namespace.yml
          DB_URL=$(terraform output -raw db_connection_string)
          kubectl create secret generic backend-secrets \
            --namespace idea-board \
            --from-literal=DATABASE_URL="$DB_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy AWS workloads
        env:
          BACKEND_IMAGE: ${{ steps.ecr.outputs.backend }}:${{ steps.ecr.outputs.tag }}
          FRONTEND_IMAGE: ${{ steps.ecr.outputs.frontend }}:${{ steps.ecr.outputs.tag }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="$RUNNER_TEMP/k8s-aws"
          mkdir -p "$DEPLOY_DIR"
          cp -R k8s/. "$DEPLOY_DIR/"

          sed -i -E "s|^([[:space:]]*image:[[:space:]]*).*$|\1${BACKEND_IMAGE}|" "$DEPLOY_DIR/backend-deployment.yaml"
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*).*$|\1${FRONTEND_IMAGE}|" "$DEPLOY_DIR/frontend-deployment.yaml"

          kubectl apply -k "$DEPLOY_DIR"

      - name: Verify deployment and roll back on failed health checks
        run: |
          rollback() {
            kubectl rollout undo deployment/backend -n idea-board || true
            kubectl rollout undo deployment/frontend -n idea-board || true
          }
          if ! kubectl rollout status deployment/backend -n idea-board --timeout=240s ||
             ! kubectl rollout status deployment/frontend -n idea-board --timeout=180s; then
            rollback
            exit 1
          fi
          HOST=""
          for attempt in $(seq 1 36); do
            HOST=$(kubectl get service frontend -n idea-board -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            sleep 10
          done
          if [ -z "$HOST" ]; then
            echo "AWS load balancer did not receive a hostname"
            rollback
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 10 "http://${HOST}/health" > health-response.json; then
            rollback
            exit 1
          fi
          if ! python -c "import json; d=json.load(open('health-response.json')); assert d.get('status') == 'ok' and d.get('db') == 'connected', d"; then
            rollback
            exit 1
          fi
          echo "APP_URL=http://${HOST}" >> "$GITHUB_ENV"
          echo "AWS deployment healthy: http://${HOST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run optional Gemini diagnostics
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          kubectl get pods -n idea-board -o json > pod-status.json 2>/dev/null || echo '{}' > pod-status.json
          kubectl logs deployment/backend -n idea-board --tail=100 > deployment-logs.txt 2>&1 || true
          test -f health-response.json || echo '{"status":"not available"}' > health-response.json
          python -m pip install -r ai/requirements.txt || echo "Gemini SDK install failed; skipping optional analysis."
          if python -c "import google.genai" 2>/dev/null; then
            python ai/deployment_analyzer.py \
              --deployment-status "${{ job.status }} for AWS commit ${GITHUB_SHA}" \
              --health-file health-response.json \
              --pod-status-file pod-status.json \
              --logs-file deployment-logs.txt || true
          fi
          if [ -f ai_health_report.json ]; then cat ai_health_report.json >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-deployment-diagnostics
          path: |
            ai_health_report.json
            health-response.json
            pod-status.json
          if-no-files-found: ignore

  plan-gcp:
    name: Create GCP Terraform plan
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.cloud == 'gcp' &&
      inputs.approve_infrastructure == 'yes'
    runs-on: ubuntu-latest
    environment: plan-gcp
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      GCP_GKE_API_CIDR: ${{ vars.GCP_GKE_API_CIDR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Create and display GCP Terraform plan
        working-directory: terraform/environments/gcp
        run: |
          test -n "$TF_VAR_db_password" || { echo "DB_PASSWORD secret is required"; exit 1; }
          test -n "$TF_VAR_project_id" || { echo "GCP_PROJECT_ID secret is required"; exit 1; }
          test -n "$GCP_GKE_API_CIDR" || { echo "GCP_GKE_API_CIDR Actions variable is required"; exit 1; }
          python -c "import ipaddress,sys; ipaddress.ip_network(sys.argv[1], strict=False)" "$GCP_GKE_API_CIDR"
          terraform init
          terraform plan -var="control_plane_authorized_cidrs=[\"${GCP_GKE_API_CIDR}\"]" -out=tfplan
          terraform show -no-color tfplan | tee tfplan.txt
          {
            echo "## GCP Terraform plan"
            echo '```'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Store reviewed GCP plan for one day
        uses: actions/upload-artifact@v4
        with:
          name: gcp-terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terraform/environments/gcp/tfplan
            terraform/environments/gcp/tfplan.txt
          retention-days: 1
          if-no-files-found: error

  deploy-gcp:
    name: Apply approved GCP plan and deploy
    needs: [plan-gcp, build]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.cloud == 'gcp' &&
      inputs.approve_infrastructure == 'yes'
    runs-on: ubuntu-latest
    environment: production-gcp
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GHCR_BACKEND: ${{ needs.build.outputs.backend_image }}
      GHCR_FRONTEND: ${{ needs.build.outputs.frontend_image }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download reviewed GCP Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: gcp-terraform-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: terraform/environments/gcp

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply reviewed GCP Terraform plan
        working-directory: terraform/environments/gcp
        run: |
          terraform init
          terraform apply -auto-approve tfplan

      - name: Copy images to Artifact Registry
        id: artifact
        working-directory: terraform/environments/gcp
        run: |
          IMAGE_REPO=$(terraform output -raw image_repository)
          REGISTRY_HOST="${IMAGE_REPO%%/*}"
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet
          RELEASE_TAG="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          docker pull "${GHCR_BACKEND}:${GITHUB_SHA}"
          docker pull "${GHCR_FRONTEND}:${GITHUB_SHA}"
          docker tag "${GHCR_BACKEND}:${GITHUB_SHA}" "${IMAGE_REPO}/backend:${RELEASE_TAG}"
          docker tag "${GHCR_FRONTEND}:${GITHUB_SHA}" "${IMAGE_REPO}/frontend:${RELEASE_TAG}"
          docker push "${IMAGE_REPO}/backend:${RELEASE_TAG}"
          docker push "${IMAGE_REPO}/frontend:${RELEASE_TAG}"
          echo "backend=${IMAGE_REPO}/backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${IMAGE_REPO}/frontend" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure GKE cluster access
        working-directory: terraform/environments/gcp
        run: |
          gcloud container clusters get-credentials "$(terraform output -raw cluster_name)" \
            --region "$(terraform output -raw region)" \
            --project "$TF_VAR_project_id"

      - name: Create namespace and database secret
        working-directory: terraform/environments/gcp
        run: |
          kubectl apply -f ../../../k8s/namespace.yml
          DB_URL=$(terraform output -raw db_connection_string)
          kubectl create secret generic backend-secrets \
            --namespace idea-board \
            --from-literal=DATABASE_URL="$DB_URL" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy GCP workloads
        env:
          BACKEND_IMAGE: ${{ steps.artifact.outputs.backend }}:${{ steps.artifact.outputs.tag }}
          FRONTEND_IMAGE: ${{ steps.artifact.outputs.frontend }}:${{ steps.artifact.outputs.tag }}
        run: |
          set -euo pipefail
          DEPLOY_DIR="$RUNNER_TEMP/k8s-gcp"
          mkdir -p "$DEPLOY_DIR"
          cp -R k8s/. "$DEPLOY_DIR/"

          sed -i -E "s|^([[:space:]]*image:[[:space:]]*).*$|\1${BACKEND_IMAGE}|" "$DEPLOY_DIR/backend-deployment.yaml"
          sed -i -E "s|^([[:space:]]*image:[[:space:]]*).*$|\1${FRONTEND_IMAGE}|" "$DEPLOY_DIR/frontend-deployment.yaml"

          kubectl apply -k "$DEPLOY_DIR"

      - name: Verify deployment and roll back on failed health checks
        run: |
          rollback() {
            kubectl rollout undo deployment/backend -n idea-board || true
            kubectl rollout undo deployment/frontend -n idea-board || true
          }
          if ! kubectl rollout status deployment/backend -n idea-board --timeout=240s ||
             ! kubectl rollout status deployment/frontend -n idea-board --timeout=180s; then
            rollback
            exit 1
          fi
          HOST=""
          for attempt in $(seq 1 36); do
            HOST=$(kubectl get service frontend -n idea-board -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            [ -n "$HOST" ] && break
            sleep 10
          done
          if [ -z "$HOST" ]; then
            echo "GCP load balancer did not receive an IP"
            rollback
            exit 1
          fi
          if ! curl --fail --silent --show-error --max-time 10 "http://${HOST}/health" > health-response.json; then
            rollback
            exit 1
          fi
          if ! python -c "import json; d=json.load(open('health-response.json')); assert d.get('status') == 'ok' and d.get('db') == 'connected', d"; then
            rollback
            exit 1
          fi
          echo "APP_URL=http://${HOST}" >> "$GITHUB_ENV"
          echo "GCP deployment healthy: http://${HOST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Run optional Gemini diagnostics
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          kubectl get pods -n idea-board -o json > pod-status.json 2>/dev/null || echo '{}' > pod-status.json
          kubectl logs deployment/backend -n idea-board --tail=100 > deployment-logs.txt 2>&1 || true
          test -f health-response.json || echo '{"status":"not available"}' > health-response.json
          python -m pip install -r ai/requirements.txt || echo "Gemini SDK install failed; skipping optional analysis."
          if python -c "import google.genai" 2>/dev/null; then
            python ai/deployment_analyzer.py \
              --deployment-status "${{ job.status }} for GCP commit ${GITHUB_SHA}" \
              --health-file health-response.json \
              --pod-status-file pod-status.json \
              --logs-file deployment-logs.txt || true
          fi
          if [ -f ai_health_report.json ]; then cat ai_health_report.json >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-deployment-diagnostics
          path: |
            ai_health_report.json
            health-response.json
            pod-status.json
          if-no-files-found: ignore
