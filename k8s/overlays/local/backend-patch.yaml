apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: idea-board
spec:
  template:
    spec:
      containers:
        - name: backend
          livenessProbe:
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            timeoutSeconds: 5
            failureThreshold: 24
