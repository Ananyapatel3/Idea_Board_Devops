apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: idea-board
spec:
  template:
    spec:
      containers:
        - name: frontend
          livenessProbe:
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
